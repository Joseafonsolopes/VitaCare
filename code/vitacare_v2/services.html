<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitaCare - Services</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/services.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <div id="navbar"></div>
  <div id="root"></div>

  <!-- NAVBAR -->
  <script type="text/babel">
    function Navbar() {
      return (
        <nav className="navbar">
          <div className="navbar-logo">Vitacare</div>
          <ul className="navbar-liens">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="services.html" className="actif">Services</a></li>
            <li><a href="reservation.html">Prendre rendez-vous</a></li>
            <li><a href="profil.html">Mon profil</a></li>
          </ul>
          <a href="connexion.html" className="navbar-btn-connexion">Connexion</a>
        </nav>
      );
    }
    const navRoot = ReactDOM.createRoot(document.getElementById('navbar'));
    navRoot.render(<Navbar />);
  </script>

  <!-- PAGE SERVICES -->
  <script type="text/babel">

    const tousServices = [
      { id: 1, emoji: '🧘', nom: 'Yoga Douceur', intervenant: 'Marie Dupont', duree: 60, note: 4.9, prix: 45, categorie: 'Bien-être', badge: 'Populaire', couleur: '#e8f0eb' },
      { id: 2, emoji: '🥗', nom: 'Consultation nutrition', intervenant: 'Élise Garnier', duree: 45, note: 4.7, prix: 35, categorie: 'Nutrition', badge: 'Nouveau', couleur: '#f5f0e8' },
      { id: 3, emoji: '🧠', nom: 'Sophrologie', intervenant: 'Claire Bernard', duree: 50, note: 4.8, prix: 59, categorie: 'Santé mentale', badge: null, couleur: '#fce8f0' },
      { id: 4, emoji: '🚶', nom: 'Marche nordique', intervenant: 'Paul Renaud', duree: 60, note: 4.6, prix: 30, categorie: 'Activités', badge: null, couleur: '#e8f0fc' },
      { id: 5, emoji: '💆', nom: 'Massage thérapeutique', intervenant: 'Sophie Morin', duree: 60, note: 4.8, prix: 75, categorie: 'Thérapies', badge: null, couleur: '#fce8e8' },
      { id: 6, emoji: '🌿', nom: 'Méditation guidée', intervenant: 'Julien Roussel', duree: 45, note: 4.7, prix: 25, categorie: 'Bien-être', badge: null, couleur: '#e8f5eb' },
    ];

    const categories = ['Toutes', 'Bien-être', 'Nutrition', 'Santé mentale', 'Activités'];

    function CarteService({ service }) {
      function allerReservation() {
        localStorage.setItem('serviceChoisi', JSON.stringify(service));
        window.location.href = 'reservation.html';
      }

      return (
        <div className="carte-catalogue">
          <div className="carte-header" style={{backgroundColor: service.couleur}}>
            <span className="carte-emoji">{service.emoji}</span>
            {service.badge && (
              <span className={service.badge === 'Populaire' ? 'badge badge-vert' : 'badge badge-beige'}>
                {service.badge}
              </span>
            )}
          </div>
          <div className="carte-body">
            <h3>{service.nom}</h3>
            <p className="carte-intervenant">{service.intervenant} · {service.duree} min · ★ {service.note}</p>
            <div className="carte-footer">
              <span className="carte-prix">{service.prix}€</span>
              <button className="btn-creneaux" onClick={allerReservation}>
                Voir les créneaux
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Services() {
      const [recherche, setRecherche] = React.useState('');
      const [categorieActive, setCategorieActive] = React.useState('Toutes');
      const [filtreduree, setFiltreduree] = React.useState('');
      const [filtrePrix, setFiltrePrix] = React.useState('');

      function reinitialiserFiltres() {
        setRecherche('');
        setCategorieActive('Toutes');
        setFiltreduree('');
        setFiltrePrix('');
      }

      const servicesFiltres = tousServices.filter(function(s) {
        const matchRecherche = s.nom.toLowerCase().includes(recherche.toLowerCase()) ||
          s.intervenant.toLowerCase().includes(recherche.toLowerCase());
        const matchCat = categorieActive === 'Toutes' || s.categorie === categorieActive;
        const matchDuree = !filtreduree ||
          (filtreduree === '30' && s.duree <= 30) ||
          (filtreduree === '30-60' && s.duree > 30 && s.duree <= 60) ||
          (filtreduree === '90' && s.duree > 60);
        const matchPrix = !filtrePrix ||
          (filtrePrix === '0-30' && s.prix <= 30) ||
          (filtrePrix === '30-60' && s.prix > 30 && s.prix <= 60) ||
          (filtrePrix === '60+' && s.prix > 60);
        return matchRecherche && matchCat && matchDuree && matchPrix;
      });

      return (
        <div className="services-page">

          {/* SIDEBAR FILTRES */}
          <aside className="sidebar-filtres">
            <div className="filtres-header">
              <h3>Filtres</h3>
              <button className="btn-reinitialiser" onClick={reinitialiserFiltres}>
                Réinitialiser
              </button>
            </div>

            <div className="filtre-groupe">
              <p className="filtre-titre">Type de service</p>
              {['Toutes', 'Consultations', 'Activités', 'Thérapies', 'Nutrition'].map(function(c) {
                return (
                  <label key={c} className="filtre-option">
                    <input
                      type="radio"
                      name="type"
                      checked={categorieActive === c}
                      onChange={function() { setCategorieActive(c); }}
                    />
                    {c}
                  </label>
                );
              })}
            </div>

            <div className="filtre-groupe">
              <p className="filtre-titre">Durée</p>
              {[{val: '30', label: '30 min'}, {val: '30-60', label: '30 - 60 min'}, {val: '90', label: '90 min+'}].map(function(d) {
                return (
                  <label key={d.val} className="filtre-option">
                    <input
                      type="radio"
                      name="duree"
                      checked={filtreduree === d.val}
                      onChange={function() { setFiltreduree(d.val); }}
                    />
                    {d.label}
                  </label>
                );
              })}
            </div>

            <div className="filtre-groupe">
              <p className="filtre-titre">Prix</p>
              {[{val: '0-30', label: '0 - 30€'}, {val: '30-60', label: '30 - 60€'}, {val: '60+', label: '60€+'}].map(function(p) {
                return (
                  <label key={p.val} className="filtre-option">
                    <input
                      type="radio"
                      name="prix"
                      checked={filtrePrix === p.val}
                      onChange={function() { setFiltrePrix(p.val); }}
                    />
                    {p.label}
                  </label>
                );
              })}
            </div>
          </aside>

          {/* CONTENU */}
          <main className="services-contenu">
            <input
              className="barre-recherche"
              type="text"
              placeholder="Rechercher un service..."
              value={recherche}
              onChange={function(e) { setRecherche(e.target.value); }}
            />

            <div className="onglets-categories">
              {categories.map(function(cat) {
                return (
                  <button
                    key={cat}
                    className={categorieActive === cat ? 'onglet actif' : 'onglet'}
                    onClick={function() { setCategorieActive(cat); }}
                  >
                    {cat}
                  </button>
                );
              })}
            </div>

            <p className="compteur">{servicesFiltres.length} services disponibles</p>

            <div className="grille-catalogue">
              {servicesFiltres.map(function(s) {
                return <CarteService key={s.id} service={s} />;
              })}
            </div>
          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Services />);
  </script>

</body>
</html>
