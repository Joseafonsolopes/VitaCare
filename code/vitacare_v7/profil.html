<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitaCare - Mon Profil</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/profil.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <div id="navbar"></div>
  <div id="root"></div>

  <!-- NAVBAR -->
  <script type="text/babel">
    function Navbar() {
      return (
        <nav className="navbar">
          <div className="navbar-logo">Vitacare</div>
          <ul className="navbar-liens">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="reservation.html">Prendre rendez-vous</a></li>
            <li><a href="profil.html" className="actif">Mon profil</a></li>
          </ul>
          <a href="connexion.html" className="navbar-btn-connexion">Connexion</a>
        </nav>
      );
    }
    const navRoot = ReactDOM.createRoot(document.getElementById('navbar'));
    navRoot.render(<Navbar />);
  </script>

  <!-- PAGE PROFIL -->
  <script type="text/babel">

    function Profil() {
      const utilisateur = {
        initiales: 'NM',
        nom: 'Nathéo Milliet',
        membre_depuis: 'janvier 2025',
        adresse: '10 rue Sextius Michel, 75015 Paris',
        statut: 'Membre actif',
      };

      return (
        <div className="profil-page">
          <div className="profil-header">
            <div className="profil-avatar">{utilisateur.initiales}</div>
            <div className="profil-info">
              <h2>{utilisateur.nom}</h2>
              <p>Membre depuis {utilisateur.membre_depuis}</p>
              <span className="badge-statut">{utilisateur.statut}</span>
            </div>
            <button className="btn-modifier-profil">Modifier</button>
          </div>

          <div className="profil-section">
            <h3>Informations</h3>
            <div className="info-item">
              <span className="info-icone">📍</span>
              <div>
                <p className="info-label">Adresse</p>
                <p className="info-valeur">{utilisateur.adresse}</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Profil />);
  </script>

</body>
</html>
